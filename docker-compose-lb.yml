version: '3.8'

services:
  red-app:
    build: ./red
    networks:
      - traffic-light

  yellow-app:
    build: ./yellow
    networks:
      - traffic-light

  green-app:
    build: ./green
    networks:
      - traffic-light

  nginx-lb:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
    networks:
      - traffic-light
    depends_on:
      - red-app
      - yellow-app
      - green-app

networks:
  traffic-light:
    ipam:
      driver: default
      config:
        - subnet: "172.20.0.0/16"
